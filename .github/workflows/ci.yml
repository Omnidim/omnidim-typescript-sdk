name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # release-please keeps one release PR open with the next version and changelog.
  # Merging it tags vX.Y.Z here, and publish runs in this same workflow because
  # a tag made with this workflow's token starts no new run.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      # Trusted publishing authenticates with the job's OIDC identity, so no
      # npm token is involved. It needs Node >= 22.14 and npm >= 11.5.1,
      # which no Node line bundles yet.
      #
      # No registry-url on purpose. It makes setup-node write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and with no secret to fill it that
      # resolves to setup-node's literal placeholder. npm then publishes with
      # a junk token and the registry answers 404, which reads as "no such
      # package" and hides the real problem. Without it, a missing trusted
      # publisher fails as ENEEDAUTH, which says what is actually wrong.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm --version && node --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
