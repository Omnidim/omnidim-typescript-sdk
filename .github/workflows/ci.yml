name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing authenticates with the job's OIDC identity, so no
      # npm token is involved. It needs Node >= 22.14 and npm >= 11.5.1,
      # which no Node line bundles yet.
      #
      # No registry-url on purpose. It makes setup-node write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and with no secret to fill it that
      # resolves to setup-node's literal placeholder. npm then publishes with
      # a junk token and the registry answers 404, which reads as "no such
      # package" and hides the real problem. Without it, a missing trusted
      # publisher fails as ENEEDAUTH, which says what is actually wrong.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm --version && node --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Extract changelog entry for this release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for version $VERSION" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
